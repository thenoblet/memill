[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memill"
version = "1.0.0"
description = "Download YouTube audio and convert it to a tagged MP3 with ffmpeg."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Patrick A. Noblet" }]
keywords = ["youtube", "audio", "mp3", "ffmpeg", "yt-dlp", "id3", "music"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = ["yt-dlp>=2024.1.1", "rich>=13.0"]

[project.urls]
Homepage = "https://github.com/thenoblet/memill"
Repository = "https://github.com/thenoblet/memill"
Issues = "https://github.com/thenoblet/memill/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8", "ruff>=0.4"]

[project.scripts]
memill = "memill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memill"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# No addopts = "-q": combined with a command-line -q it reaches verbosity -2
# and suppresses the summary line entirely, so a run reports no pass count.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt2mp3"
version = "1.0.0"
description = "Download YouTube audio and convert it to a tagged MP3 with ffmpeg."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Patrick A. Noblet" }]
dependencies = ["yt-dlp>=2024.1.1", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8", "ruff>=0.4"]

[project.scripts]
yt2mp3 = "yt2mp3.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yt2mp3"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# No addopts = "-q": combined with a command-line -q it reaches verbosity -2
# and suppresses the summary line entirely, so a run reports no pass count.
